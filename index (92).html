/* ===== cálculo da entrega (Piracicaba): OpenStreetMap, sem chave ===== */
const GC={};
async function geo(q,precisaPira){
  const key=q+"|"+(precisaPira?1:0);if(GC[key])return GC[key];
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&q="+encodeURIComponent(q));
    const j=await r.json();
    if(j&&j[0]&&(!precisaPira||/piracicaba/i.test(j[0].display_name||""))){return GC[key]={lat:+j[0].lat,lon:+j[0].lon}}
  }catch(e){}
  return null;
}
const hav=(a,b)=>{const t=x=>x*D,dLa=t(b.lat-a.lat),dLo=t(b.lon-a.lon),h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 6371*2*Math.asin(Math.sqrt(h))};
async function dist(a,b){
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
    const j=await r.json();
    if(j&&j.routes&&j.routes[0])return j.routes[0].distance/1000;
  }catch(e){}
  return hav(a,b)*1.3;
}
async function calcEntrega(rua,bairro,sub){
  try{
    const oq=/piracicaba/i.test(CFG.endereco)?CFG.endereco:CFG.endereco+", Piracicaba, SP";
    const o=await geo(oq+", Brasil",false);
    const semNum=rua.replace(/[,\s]*(n[º°o]?\s*)?\d+.*$/i,"").trim()||rua;
    let d=null;
    for(const q of [`${rua}, ${bairro}, Piracicaba, SP, Brasil`,`${semNum}, ${bairro}, Piracicaba, SP, Brasil`,`${semNum}, Piracicaba, SP, Brasil`]){d=await geo(q,true);if(d)break}
    if(!o||!d)return{st:"nao"};
    const km=Math.round((await dist(o,d))*10)/10;
    if(km>CFG.dist_max)return{st:"fora",km};
    let fee=CFG.taxa_base+CFG.valor_km*km;
    if(CFG.gratis_acima&&sub>=CFG.gratis_acima)fee=0;
    return{st:"ok",km,fee:Math.round(fee*100)/100};
  }catch(e){return{st:"nao"}}
}

  $("#ov").classList.add("on");
  $("#m-ok").onclick=()=>{
    const itens=$("#m-i").value.split("\n").map(s=>s.trim()).filter(Boolean),n=$("#m-n").value.trim(),t=$("#m-t").value.trim(),e=$("#m-e").value.trim();
    if(!n||!t||!e||!itens.length){alert("Preencha nome, WhatsApp, endereço e itens.");return}
    const ent=pn($("#m-d").value),tot=pn($("#m-v").value);
    $("#ov").classList.remove("on");
    addOrder({id:String(Math.floor(100000+Math.random()*900000)),status:"novo",nome:n,tel:t,endereco:e,pagamento:$("#m-p").value,obs:null,itens,subtotal:Math.max(0,tot-ent),taxa_entrega:ent,distancia_km:null,total:tot});
  };
}
/* edição */
function tCar(){
  return `<div class="oc"><b>Tamanhos das pizzas</b>`+DR.sizes.map((z,j)=>`<div class="ed" style="grid-template-columns:1fr 1fr;margin-top:6px"><input value="${esc(z[0])}" oninput="DR.sizes[${j}][0]=this.value"><input value="${esc(z[1])}" oninput="DR.sizes[${j}][1]=this.value"></div>`).join("")+`</div>`+
  DR.menu.map((c,ci)=>`<div class="oc"><div class="ed" style="grid-template-columns:1fr auto"><input value="${esc(c[0])}" oninput="DR.menu[${ci}][0]=this.value" placeholder="Categoria"><button class="btn s g" onclick="DR.menu.splice(${ci},1);draw()">Remover</button></div><label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" style="width:auto" ${c[2]?"checked":""} onchange="DR.menu[${ci}][2]=this.checked;DR.menu[${ci}][1].forEach(it=>{if(!it[4]||!it[4].length)it[4]=DR.sizes.map(()=>it[2])});draw()"> Vendida por tamanho</label>`+
  c[1].map((it,ii)=>`<div class="ed" style="grid-template-columns:1fr auto"><input value="${esc(it[1])}" oninput="DR.menu[${ci}][1][${ii}][1]=this.value" placeholder="Nome"><button class="btn s g" onclick="DR.menu[${ci}][1].splice(${ii},1);draw()">✕</button></div><div class="ed d"><input value="${esc(it[3])}" oninput="DR.menu[${ci}][1][${ii}][3]=this.value" placeholder="Descrição"></div>`+
   (c[2]?`<div class="ed" style="grid-template-columns:repeat(${DR.sizes.length},1fr)">${DR.sizes.map((z,j)=>`<input type="number" step="0.5" title="${esc(z[0])}" placeholder="${esc(z[0])}" value="${(it[4]||[])[j]||0}" oninput="DR.menu[${ci}][1][${ii}][4][${j}]=Number(this.value)||0">`).join("")}</div>`:`<div class="ed d"><input type="number" step="0.5" value="${it[2]}" oninput="DR.menu[${ci}][1][${ii}][2]=Number(this.value)||0"></div>`)).join("")+
  `<button class="btn s" onclick="DR.menu[${ci}][1].push(['i'+Date.now(),'Novo item',0,'',DR.sizes.map(()=>0)]);draw()">+ Item</button></div>`).join("")+`<button class="btn s g" onclick="DR.menu.push(['Nova categoria',[],false]);draw()">+ Categoria</button>`+saveBtn();
}
const gp=p=>p.split(".").reduce((a,b)=>a&&a[b],DR);
function setp(p,v){const a=p.split(".");let o=DR;while(a.length>1)o=o[a.shift()];o[a[0]]=v}
function fld(l,p,o){
  o=o||{};const v=esc(gp(p)==null?"":gp(p));
  return `<label>${l}</label>`+(o.ta?`<textarea rows="3" oninput="setp('${p}',this.value)">${v}</textarea>`:`<input ${o.dec?'inputmode="decimal" ':""}value="${v}" oninput="setp('${p}',this.value)">`)+(o.h?`<p class="mut" style="margin:4px 0 0">${o.h}</p>`:"");
}
function tCfg(){
  return `<h2>Loja</h2>`+fld("Nome da loja","nome")+fld("WhatsApp da pizzaria (com DDD)","zap",{h:"Só números, com DDD. Ex.: 5519999999999"})+fld("Tempo estimado","tempo")+
  `<h2>Entrega</h2>`+fld("Endereço da pizzaria","endereco",{h:"Rua, número e bairro em Piracicaba. É daqui que a distância até o cliente é medida."})+fld("Taxa base (R$)","taxa_base",{dec:1})+fld("Valor por km (R$)","valor_km",{dec:1})+fld("Distância máxima de entrega (km)","dist_max",{dec:1})+fld("Entrega grátis a partir de (R$)","gratis_acima",{dec:1,h:"Deixe vazio para não ter entrega grátis."})+
  `<h2>Mensagens por WhatsApp</h2><p class="mut">Use {nome} {pedido} {total} {tempo} {loja}. Abrem prontas no WhatsApp do cliente quando você muda o status.</p>`+
  Object.keys(ST).filter(k=>k!=="novo").map(k=>fld(ST[k],"m."+k,{ta:1})).join("")+saveBtn()+
  `<h2>Senha do painel</h2><label>Nova senha (mínimo 6 caracteres)</label><input id="np" type="password" autocomplete="new-password"><button class="btn s" style="margin-top:10px" onclick="trocarSenha()">Trocar senha</button>`;
}
async function trocarSenha(){
  const v=$("#np").value;if(v.length<6){alert("Use pelo menos 6 caracteres.");return}
  try{const r=await api("painel_trocar_senha",{p_nova:v});if(r&&r.ok){PW=v;try{sessionStorage.setItem("kp_pw",v)}catch(e){}$("#np").value="";alert("Senha trocada.")}else alert("Não foi possível trocar a senha.")}catch(e){if(e.message!=="auth")alert("Erro ao trocar a senha.")}
}
async function save(){
  const n=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
  DR.menu.forEach(c=>c[1].forEach(i=>{if(c[2])i[2]=(i[4]||[])[2]||i[2]}));
  const row={nome:DR.nome,zap:DR.zap,tempo:DR.tempo,endereco:DR.endereco,taxa_base:n(DR.taxa_base),valor_km:n(DR.valor_km),dist_max:n(DR.dist_max),gratis_acima:n(DR.gratis_acima),mensagens:DR.m,cardapio:{sizes:DR.sizes,menu:DR.menu}};
  try{
    const r=await api("painel_config_salvar",{p_config:row});
    if(r&&r.ok){applyCfg(JSON.parse(JSON.stringify(row)));renderMenu();alert("Salvo! O site já está atualizado para os clientes.")}
    else alert("Não foi possível salvar.");
  }catch(e){if(e.message!=="auth")alert("Não foi possível salvar: "+(e.message||e))}
}

/* ===== início ===== */
renderMenu();loadConfig();route();
</script>
